name: CI

# Lint, typecheck and test both projects on every pull request.
#
# Deliberately carries no `paths:` filter, unlike docs.yml. A filtered workflow
# reports nothing at all on a PR that misses the filter, so a required status
# check that is also path-filtered blocks the PR forever waiting for a run that
# will never come. docs.yml can afford filters because it is not required.
#
# The runner is pinned rather than `ubuntu-latest`: GitHub migrates that label
# on its own schedule, and the migration lands mid-PR with no commit to blame.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon:
    name: Add-on lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: addon/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # These three are independent, so one failure should not hide the other
      # two — but they are still skipped if the install itself never succeeded,
      # which `!cancelled()` alone would not do.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  # The end-to-end suite is deliberately NOT here yet. Its first run hung for
  # four hours on `npx playwright install --with-deps chromium` — not failing,
  # just never returning, so the only thing that would have ended it is the
  # 6-hour default job timeout. Until that is diagnosed, the browser half stays
  # off and only the integration suite runs, which needs no browser at all and
  # so cannot hit the same wall. `npm run test:e2e` locally still covers it.
  #
  # Restoring it means putting back the version-keyed ~/.cache/ms-playwright
  # cache, the install steps and the report upload — all of them in this file's
  # history at commit 9d68687 — with whatever fixes the hang.
  addon-integration:
    name: Add-on integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: addon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: addon/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Not through `npm run test:integration`, which would build a second time.
      # The suite needs the build: the ingress handling under test lives in
      # server.js and in the built asset manifest, neither of which a dev server
      # uses.
      - name: Build
        run: npm run build

      - name: Integration tests
        run: npx vitest run --project integration

  site:
    name: Docs site lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            addon/package-lock.json
            site/package-lock.json

      # The site's own lint and typecheck scripts shell out to the add-on's
      # Biome and tsc with `npm --prefix ../addon exec --no --`, where `--no`
      # makes a missing addon/node_modules an error rather than a download. So
      # this job needs both installs, even though the checks are the site's.
      - name: Install the add-on's dependencies
        run: npm ci
        working-directory: addon

      - name: Install dependencies
        id: install
        run: npm ci
        working-directory: site

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
        working-directory: site

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
        working-directory: site

      # Not `docs:build` — docs.yml already builds the site on pull requests,
      # and that build is the dead-link check.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
        working-directory: site
