name: Docs site

# Builds the VitePress site in site/ and publishes it to GitHub Pages.
#
# The build job runs on pull requests too, where it is the link check: the site
# pulls docs/ in at build time and rewrites every link in it, so a doc moving is
# exactly the change that breaks the site, and VitePress fails the build on a
# dead link. Only main deploys.
#
# GitHub Pages must be set to "GitHub Actions" as its source
# (Settings -> Pages) or the deploy job fails with nothing to deploy to.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run docs:build
        working-directory: site

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
