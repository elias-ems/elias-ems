# Git hooks, run by lefthook. It is an addon/ dev dependency, and the lefthook
# *package* ships its own postinstall that runs `lefthook install -f` — nothing
# in addon/package.json does this — so hooks appear after `npm install` there.
# If they go missing, run `npx lefthook install` from addon/, not the repo root.
# Set LEFTHOOK=0 to skip hooks for one command.
#
# Globs are matched against repo-root-relative paths and deliberately ignore
# `root`, so they carry the addon/ prefix that `root` then strips off.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: biome
      root: "addon/"
      glob:
        - "addon/**/*.{js,jsx,ts,tsx,json,jsonc,css}"
        - "!addon/package-lock.json"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    # site/ is the other npm project and has no Biome of its own — one copy has
    # to format the whole repo or the two versions fight over the same files. So
    # this job takes no `root:` (paths stay repo-root-relative, which is what
    # {staged_files} hands it) and reaches into addon/ for the binary and the
    # config. `npm exec --no` fails rather than falling back to the registry,
    # where an unrelated package happens to be called `biome`.
    - name: biome-site
      glob:
        - "site/**/*.{js,mjs,ts,json,jsonc,css}"
        - "!site/package-lock.json"
      run: npm --prefix addon exec --no -- biome check --write --config-path addon --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
