# Git hooks, run by lefthook. It is an addon/ dev dependency, and the lefthook
# *package* ships its own postinstall that runs `lefthook install -f` — nothing
# in addon/package.json does this — so hooks appear after `npm install` there.
# If they go missing, run `npx lefthook install` from addon/, not the repo root.
# Set LEFTHOOK=0 to skip hooks for one command.
#
# Globs are matched against repo-root-relative paths and deliberately ignore
# `root`, so they carry the addon/ prefix that `root` then strips off.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: biome
      root: "addon/"
      glob:
        - "addon/**/*.{js,jsx,ts,tsx,json,jsonc,css}"
        - "!addon/package-lock.json"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
